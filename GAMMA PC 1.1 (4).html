<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAMMA PC 1.1</title>
<style>
:root{--panel:rgba(14,20,48,.82);--solid:#0b1030;--text:#e6ecff;--mut:#8b97c4;--acc:#22d3ee;--vio:#8b5cf6;--bd:rgba(130,150,255,.25);--fs:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=light]{--panel:rgba(255,255,255,.88);--solid:#fff;--text:#101633;--mut:#51608f;--bd:rgba(40,60,160,.28)}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;font:calc(15px*var(--fs)) system-ui,Segoe UI,Roboto,sans-serif;color:var(--text);background:#050816}
#desk{position:absolute;inset:0;background-size:cover;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
#icons{display:grid;grid-template-columns:repeat(auto-fill,78px);grid-auto-rows:84px;gap:6px;height:calc(100% - 64px);grid-auto-flow:column;align-content:start;pointer-events:none}
#icons{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(52px + env(safe-area-inset-bottom,0px));display:block;height:auto;padding:0}
.ic{position:absolute;width:78px;height:84px;touch-action:none;pointer-events:auto;text-align:center;font-size:.8em;padding:6px 2px;border-radius:10px;cursor:pointer;color:#fff;text-shadow:0 1px 4px #000;user-select:none}
.ic:hover,.ic:focus{background:rgba(255,255,255,.14);outline:1px solid var(--acc)}.ic b{display:block;font-size:2em;font-weight:400}
.win{position:absolute;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:12px;resize:both;overflow:hidden;min-width:260px;min-height:180px;box-shadow:0 12px 40px #0008,0 0 0 1px #0002}
.win.max{left:0!important;top:env(safe-area-inset-top,0px)!important;width:100%!important;height:calc(100% - 52px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))!important;border-radius:0;resize:none}
.tb{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--vio) 35%,transparent),color-mix(in srgb,var(--acc) 25%,transparent));cursor:move;touch-action:none;user-select:none}
.tb button{width:34px;height:30px}.wb{flex:1;overflow:auto;padding:10px}
button,select,input,textarea{font:inherit;color:var(--text);background:color-mix(in srgb,var(--solid) 70%,transparent);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.p{background:var(--acc);color:#001018;border-color:var(--acc)}
textarea{width:100%;height:100%;resize:none}input{max-width:100%}
#bar{position:absolute;left:0;right:0;bottom:0;height:calc(52px + env(safe-area-inset-bottom,0px));padding:0 8px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:6px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);z-index:99999}
#tasks{flex:1;display:flex;gap:4px;overflow-x:auto}#tasks button.on{border-color:var(--acc);box-shadow:0 0 8px var(--acc)}
#clock{text-align:right;font-size:.8em;color:var(--mut);white-space:nowrap}
#start,#ctx{position:absolute;z-index:100000;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:12px;padding:8px;display:none}
#start{left:8px;bottom:calc(60px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 16px));max-height:60%;overflow:auto}
#start div,#ctx div{padding:8px 10px;border-radius:8px;cursor:pointer}#start div:hover,#ctx div:hover{background:color-mix(in srgb,var(--acc) 25%,transparent)}
#toast{position:absolute;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:100001;display:flex;flex-direction:column;gap:6px}
#toast span{background:var(--solid);border:1px solid var(--acc);padding:8px 12px;border-radius:8px}
.note{font-size:.85em;color:var(--mut);border-left:3px solid var(--vio);padding:4px 8px;margin:0 0 8px}
.row{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row>span{flex:1;min-width:120px;overflow-wrap:anywhere}
.msg{margin:6px 0;padding:8px;border-radius:8px;background:color-mix(in srgb,var(--vio) 22%,transparent);overflow-wrap:anywhere}.msg.u{background:color-mix(in srgb,var(--acc) 22%,transparent);text-align:right}.msg small{display:block;color:var(--mut)}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.k button{padding:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
</style></head><body>
<div id="desk"><div id="icons"></div></div>
<div id="start"><input id="sq" placeholder="Search apps…" aria-label="Search apps" style="width:100%;margin-bottom:6px"><div id="sl"></div></div>
<div id="ctx"></div><div id="toast"></div>
<div id="bar"><button id="sb" class="p" aria-label="Start menu">⚡ GAMMA</button><div id="tasks"></div><div id="clock"></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const VER="1.1";
const store={get(k,d){try{const v=localStorage.getItem("gpc_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem("gpc_"+k,JSON.stringify(v));return true}catch(e){toast("Storage failed: "+e.name);return false}}};
function toast(t){const s=document.createElement("span");s.textContent=t;$("#toast").append(s);setTimeout(()=>s.remove(),3500)}
const WALLS=["radial-gradient(circle at 20% 20%,#2b1b6b,transparent 50%),radial-gradient(circle at 80% 80%,#065a73,transparent 50%),#050816","linear-gradient(135deg,#000,#0b1d4d 60%,#4c1d95)","linear-gradient(160deg,#021326,#0a5c6e)","linear-gradient(135deg,#e0e7ff,#a5b4fc 50%,#67e8f9)"];
let S=Object.assign({theme:"dark",acc:"#22d3ee",wall:0,scale:1},store.get("set",{}));
function applyS(){const r=document.documentElement;r.dataset.theme=S.theme;r.style.setProperty("--acc",S.acc);r.style.setProperty("--fs",S.scale);const wi=S.wall==="custom"?store.get("wallimg",""):"";$("#desk").style.background=wi?`url("${wi}") center/cover no-repeat #050816`:WALLS[S.wall==="custom"?0:S.wall];store.set("set",S)}
/* ---------- window manager ---------- */
let Z=10,wins=[];
function openApp(id){if(!APPS[id])return;if(APPS[id].url){window.open(APPS[id].url,"_blank","noopener");return}let w=wins.find(x=>x.id==id);if(w){w.el.style.display="";w.min=false;focus(w);return}
 const a=APPS[id],el=document.createElement("div"),mob=innerWidth<700,n=wins.length;el.className="win";
 el.style.cssText=`left:${mob?8:60+n*26}px;top:${40+n*26}px;width:${Math.min(580,innerWidth-16)}px;height:${Math.min(430,innerHeight-90)}px`;
 el.innerHTML=`<div class="tb"><span>${a.i} ${a.t}</span><span><button data-a="min" aria-label="Minimize">–</button> <button data-a="max" aria-label="Maximize or restore">▢</button> <button data-a="x" aria-label="Close">✕</button></span></div><div class="wb"></div>`;
 $("#desk").append(el);w={id,el,min:false};wins.push(w);
 try{a.r(el.querySelector(".wb"),w)}catch(e){el.querySelector(".wb").textContent="App error: "+e.message}
 el.addEventListener("pointerdown",()=>focus(w),true);
 el.querySelector(".tb").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.a;
  if(k=="x"){el.remove();wins=wins.filter(x=>x!==w);tasks()}else if(k=="min"){el.style.display="none";w.min=true;tasks()}else el.classList.toggle("max")});
 el.querySelector(".tb").addEventListener("pointerdown",e=>{if(e.target.closest("button")||el.classList.contains("max"))return;
  const dx=e.clientX-el.offsetLeft,dy=e.clientY-el.offsetTop,t=e.currentTarget;t.setPointerCapture(e.pointerId);
  const mv=ev=>{el.style.left=Math.max(90-el.offsetWidth,Math.min(innerWidth-90,ev.clientX-dx))+"px";el.style.top=Math.max(0,Math.min(innerHeight-90,ev.clientY-dy))+"px"};
  t.addEventListener("pointermove",mv);t.addEventListener("pointerup",()=>t.removeEventListener("pointermove",mv),{once:true})});
 focus(w)}
function focus(w){w.el.style.zIndex=++Z;wins.forEach(x=>x.cur=x===w);tasks()}
function tasks(){const t=$("#tasks");t.innerHTML="";wins.forEach(w=>{const b=document.createElement("button");b.textContent=APPS[w.id].i+" "+APPS[w.id].t;b.className=w.cur&&!w.min?"on":"";
 b.onclick=()=>{if(w.min||!w.cur){w.el.style.display="";w.min=false;focus(w)}else{w.el.style.display="none";w.min=true;w.cur=false;tasks()}};t.append(b)})}
/* ---------- apps ---------- */
const APPS={
files:{t:"GAMMA Files",i:"📁",r(b){let loc="Documents",q="",prev="";
 const all=()=>store.get("files",[]),save=a=>store.set("files",a);
 const draw=()=>{const L=all().filter(f=>loc=="Recycle Bin"?f.trash:!f.trash&&f.loc==loc).filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));
  b.innerHTML=`<p class="note">Files here are stored in this browser’s storage (localStorage). This is not your real Windows or Android drive.</p>
  <div class="row">${["Documents","Downloads","Recycle Bin"].map(l=>`<button data-l="${l}" class="${l==loc?"p":""}">${l}</button>`).join("")}<input id="fq" placeholder="Search" value="${esc(q)}" style="flex:1;min-width:90px"></div>
  <div class="row"><button data-x="new">＋ Text file</button><button data-x="imp">Import</button><button data-x="bak">Backup JSON</button><button data-x="res">Restore JSON</button><input type="file" id="fi" hidden></div>
  ${L.length?L.map(f=>`<div class="row"><span>📄 ${esc(f.name)}<br><small>${f.content.length} chars · ${new Date(f.mod).toLocaleString()}</small></span>${f.trash?`<button data-a="rest" data-id="${f.id}">Restore</button><button data-a="purge" data-id="${f.id}">Delete forever</button>`:`<button data-a="view" data-id="${f.id}">Open</button><button data-a="ren" data-id="${f.id}">Rename</button><button data-a="cp" data-id="${f.id}">Copy</button><button data-a="mv" data-id="${f.id}">Move</button><button data-a="dl" data-id="${f.id}">Download</button><button data-a="del" data-id="${f.id}">Delete</button>`}</div>`).join(""):"<p>No files here.</p>"}
  ${prev?`<h4>Preview</h4><pre>${esc(prev)}</pre>`:""}`;};
 const pick=cb=>{const i=b.querySelector("#fi");i.value="";i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>1e6)return toast("File too large (1 MB max)");const r=new FileReader();r.onload=()=>cb(f,r.result);r.onerror=()=>toast("Could not read file");r.readAsText(f)};i.click()};
 const dl=(n,txt,type="text/plain")=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
 b.addEventListener("input",e=>{if(e.target.id=="fq"){q=e.target.value;const p=e.target.selectionStart;draw();const n=b.querySelector("#fq");n.focus();n.setSelectionRange(p,p)}});
 b.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;let A=all();
  if(d.l){loc=d.l;prev=""}
  else if(d.x=="new"){const n=prompt("File name:","untitled.txt");if(!n)return;A.push({id:Date.now()+""+Math.random(),name:n,loc:loc=="Recycle Bin"?"Documents":loc,content:"",mod:Date.now()});save(A)}
  else if(d.x=="imp"){return pick((f,c)=>{A.push({id:Date.now()+"",name:f.name,loc:"Downloads",content:c,mod:Date.now()});save(A);loc="Downloads";draw();toast("Imported (text files only)")})}
  else if(d.x=="bak")return dl("gamma-backup.json",JSON.stringify({v:VER,files:A,notes:store.get("notes","")}),"application/json");
  else if(d.x=="res"){return pick((f,c)=>{try{const j=JSON.parse(c);if(!Array.isArray(j.files))throw 0;save(j.files);if(j.notes)store.set("notes",j.notes);draw();toast("Restored")}catch(x){toast("Invalid backup file")}})}
  else{const f=A.find(x=>x.id==d.id);if(!f)return;
   if(d.a=="view")prev=f.content||"(empty)";
   else if(d.a=="ren"){const n=prompt("New name:",f.name);if(n){f.name=n;f.mod=Date.now();save(A)}}
   else if(d.a=="cp"){A.push({...f,id:Date.now()+"c",name:"Copy of "+f.name,mod:Date.now()});save(A)}
   else if(d.a=="mv"){f.loc=f.loc=="Documents"?"Downloads":"Documents";save(A);toast("Moved to "+f.loc)}
   else if(d.a=="dl")return dl(f.name,f.content);
   else if(d.a=="del"){f.trash=true;save(A)}
   else if(d.a=="rest"){f.trash=false;save(A)}
   else if(d.a=="purge"&&confirm("Permanently delete "+f.name+"?")){save(A.filter(x=>x!==f))}}
  draw()});draw()}},
notes:{t:"Notes",i:"📝",r(b){const t=document.createElement("textarea");t.value=store.get("notes","");t.placeholder="Type notes — autosaved in this browser";t.oninput=()=>store.set("notes",t.value);b.append(t);b.style.padding="6px"}},
calc:{t:"Calculator",i:"🧮",r(b){b.innerHTML=`<input id="e" style="width:100%;font-size:1.4em" placeholder="12*(3+4)" inputmode="decimal"><p id="o" class="note">Allowed: digits + − * / % ^ ( )</p><div class="k">${"7 8 9 / 4 5 6 * 1 2 3 - 0 . ( + ) ^ C ⌫ =".split(" ").map(k=>`<button>${k}</button>`).join("")}</div>`;
 const e=b.querySelector("#e"),o=b.querySelector("#o");
 const ev=()=>{const x=e.value.trim();if(!x)return;if(!/^[0-9+\-*/().%^\s]+$/.test(x))return o.textContent="Invalid characters";
  try{const r=Function('"use strict";return ('+x.replace(/\^/g,"**")+")")();if(typeof r!="number"||!isFinite(r))throw 0;e.value=String(+r.toPrecision(12));o.textContent="OK"}catch(z){o.textContent="Invalid expression"}};
 e.onkeydown=k=>{if(k.key=="Enter")ev()};
 b.querySelector(".k").onclick=k=>{const v=k.target.textContent;if(k.target.tagName!="BUTTON")return;v=="="?ev():v=="C"?e.value="":v=="⌫"?e.value=e.value.slice(0,-1):e.value+=v}}},
term:{t:"Terminal",i:"⌨️",r(b){b.innerHTML=`<pre id="out" style="min-height:70%">GAMMA Terminal ${VER} — type help\n</pre><input id="in" style="width:100%;font-family:monospace" placeholder="command" autocapitalize="off">`;
 const out=b.querySelector("#out"),inp=b.querySelector("#in"),p=s=>{out.textContent+=s+"\n";b.scrollTop=b.scrollHeight};
 const C={help:()=>"help date version sysinfo files echo <text> clear",date:()=>new Date().toString(),version:()=>"GAMMA PC "+VER,
  sysinfo:()=>`${navigator.userAgent}\nscreen ${screen.width}x${screen.height}, window ${innerWidth}x${innerHeight}\nonline: ${navigator.onLine}`,
  files:()=>store.get("files",[]).filter(f=>!f.trash).map(f=>f.loc+"/"+f.name).join("\n")||"(none)",clear:()=>{out.textContent="";return""}};
 inp.onkeydown=e=>{if(e.key!="Enter")return;const v=inp.value.trim();inp.value="";p("> "+v);if(!v)return;const [c,...r]=v.split(" ");
  const x=c=="echo"?r.join(" "):C[c]?C[c]():"Unknown command. Only safe built-ins exist (no shell access).";if(x)p(x)}}},
ai:{t:"GAMMA AI",i:"🤖",r(b){let H=store.get("chat",[]),cfg=store.get("ai",{url:"",speak:false});
 b.innerHTML=`<p class="note" id="st"></p><div id="log"></div><div class="row"><input id="m" placeholder="Message or math (e.g. 2+2), time, date" style="flex:1"><button id="mic">🎤</button><button class="p" id="go">Send</button></div>
 <div class="row"><button id="nw">New chat</button><button id="clr">Clear history</button><label><input type="checkbox" id="sp"> Speak replies</label></div>
 <details><summary>Provider settings</summary><p class="note">Online mode needs a backend proxy URL you host. It receives POST {messages:[{role,content}]} and must return JSON {reply:"…"}. Keep your API key on that server only, never in this file.</p><input id="u" placeholder="https://your-proxy.example/chat" style="width:100%"><button id="sv">Save</button></details>`;
 const $$=s=>b.querySelector(s),log=$$("#log");$$("#u").value=cfg.url;$$("#sp").checked=cfg.speak;
 const stt=()=>$$("#st").textContent=cfg.url?"Online mode: proxy configured (connection untested until you send)":"Offline mode: built-in tools only (math, time, date). Not an AI model.";
 const draw=()=>{log.innerHTML=H.map(m=>`<div class="msg ${m.r=="u"?"u":""}"><small>${m.r=="u"?"You":m.src}</small>${esc(m.t)}</div>`).join("");b.scrollTop=b.scrollHeight;store.set("chat",H)};
 const add=(r,t,src)=>{H.push({r,t,src});draw()};
 async function send(){const v=$$("#m").value.trim();if(!v)return;$$("#m").value="";add("u",v);
  const l=v.toLowerCase();let rep;
  if(l=="time")rep=new Date().toLocaleTimeString();else if(l=="date")rep=new Date().toLocaleDateString();
  else if(/^[0-9+\-*/().%^\s]+$/.test(v)&&/\d/.test(v)){try{rep=String(Function('"use strict";return ('+v.replace(/\^/g,"**")+")")())}catch(e){}}
  if(rep!==undefined)return say(rep,"offline tool");
  if(!cfg.url)return say("No offline tool matches that. Add a proxy URL in Provider settings for online AI.","system");
  const ld=document.createElement("div");ld.className="msg";ld.textContent="Waiting for provider…";log.append(ld);
  try{const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:H.filter(m=>m.r=="u"||m.src=="online model").map(m=>({role:m.r=="u"?"user":"assistant",content:m.t}))})});
   if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();if(typeof j.reply!="string")throw new Error("Response missing “reply”");say(j.reply,"online model")}
  catch(e){ld.remove();say("Connection error: "+e.message,"system")}}
 function say(t,src){add("a",t,src);if(cfg.speak&&src!="system"&&"speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(t))}
 $$("#go").onclick=send;$$("#m").onkeydown=e=>{if(e.key=="Enter")send()};
 $$("#nw").onclick=$$("#clr").onclick=()=>{H=[];draw()};
 $$("#sv").onclick=()=>{cfg.url=$$("#u").value.trim();store.set("ai",cfg);stt();toast("Saved")};
 $$("#sp").onchange=e=>{cfg.speak=e.target.checked;store.set("ai",cfg)};
 $$("#mic").onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast("Voice input not supported in this browser");const r=new R();r.onresult=e=>{$$("#m").value=e.results[0][0].transcript};r.onerror=e=>toast("Voice error: "+e.error);r.start()};
 stt();draw()}},
safe:{t:"Safety & SOS",i:"🆘",r(b){let c=store.get("sos",{name:"",phone:""}),loc=null,active=false;
 const draw=()=>{b.innerHTML=`<p class="note"><b>Demo-limited:</b> this app cannot place calls or send alerts on its own. It opens your phone’s dialer or messaging app, and you confirm there. In an emergency, call your local emergency number directly.</p>
 <div class="row"><input id="n" placeholder="Contact name" value="${esc(c.name)}"><input id="p" placeholder="Phone" inputmode="tel" value="${esc(c.phone)}"><button id="s">Save contact</button></div>
 <div class="row"><button id="g">Share my location (asks permission)</button><span>${loc?`Location: ${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}`:"Location not shared"}</span></div>
 <h3>Status: ${active?"🔴 SOS mode on (no alert sent automatically)":"🟢 Inactive"}</h3>
 ${active?`<div class="row">${c.phone?`<a href="tel:${esc(c.phone)}"><button class="p">Call ${esc(c.name||"contact")}</button></a><a href="sms:${esc(c.phone)}?body=${encodeURIComponent("I need help."+(loc?" My location: https://maps.google.com/?q="+loc.lat+","+loc.lon:""))}"><button>Open SMS draft</button></a>`:"<span>Add a contact first.</span>"}<button id="x">Cancel SOS</button></div>`:`<button id="a" class="p">Start SOS…</button>`}`;
 const $=s=>b.querySelector(s);
 $("#s").onclick=()=>{c={name:$("#n").value.trim(),phone:$("#p").value.trim()};store.set("sos",c);toast("Contact saved");draw()};
 $("#g").onclick=()=>{if(!navigator.geolocation)return toast("Geolocation unavailable");navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lon:p.coords.longitude};draw()},e=>toast("Location denied or failed"))};
 if($("#a"))$("#a").onclick=()=>{if(confirm("Enter SOS mode? Nothing is sent automatically; you will choose to call or text.")){active=true;draw()}};
 if($("#x"))$("#x").onclick=()=>{active=false;draw();toast("SOS cancelled")}};draw()}},
set:{t:"Settings",i:"⚙️",r(b){b.innerHTML=`<div class="row"><span>Theme</span><select id="t"><option>dark<option>light</select></div>
 <div class="row"><span>Accent</span><input type="color" id="c"></div>
 <div class="row"><span>Wallpaper</span><select id="w">${WALLS.map((_,i)=>`<option value="${i}">Wallpaper ${i+1}`).join("")}</select></div>
 <div class="row"><span>My own image</span><input type="file" id="wf" accept="image/*" hidden><button id="wu">Upload wallpaper</button><button id="wx">Reset</button></div>
 <div class="row"><span>Text size</span><input type="range" id="z" min=".85" max="1.4" step=".05"></div>
 <div class="row"><span id="u">Storage…</span><button id="r">Erase all GAMMA data</button></div>`;
 const $=s=>b.querySelector(s);$("#t").value=S.theme;$("#c").value=S.acc;$("#w").value=S.wall;$("#z").value=S.scale;
 $("#t").onchange=e=>{S.theme=e.target.value;applyS()};$("#c").oninput=e=>{S.acc=e.target.value;applyS()};$("#w").onchange=e=>{S.wall=+e.target.value;applyS()};$("#z").onchange=e=>{S.scale=+e.target.value;applyS()};
 $("#wu").onclick=()=>{$("#wf").value="";$("#wf").click()};
